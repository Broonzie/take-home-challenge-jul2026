[project]
name = "potter"
version = "0.1.0"
description = "Corpus intelligence pipeline and interactive explorer for a book series"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "rapidfuzz",
    "networkx",
    "typer",
    "rich",
    "sentence-transformers",
    "torch",
    "jinja2",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
potter = "potter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["potter"]
